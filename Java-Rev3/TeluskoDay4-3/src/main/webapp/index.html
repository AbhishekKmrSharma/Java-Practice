<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employee Record Application</title>
</head>
<body>
	<center>
		<h1>Employee Record Application</h1>
		<br>
		<hr>
	</center>
	<h3>Insert New Employee Details</h3>
	<h4>
		<form method="post" action="insert">
			Employee Id : <input type="text" name="id"><br> Employee
			Name : <input type="text" name="name"><br> Employee
			Salary : <input type="text" name="salary"><br> Employee
			Designation : <input type="text" name="designation"><br>
			<input type="submit" value="Enter">
			<hr>
		</form>
	</h4>
	
	<h2>Delete Employee</h2>
	<form method="post" action="delete">
	<h4>
		Enter Employee ID : <input type="text" name="id"> <br> <input
			type="submit" value="Enter">
	</h4></form>
</body>
</html>
